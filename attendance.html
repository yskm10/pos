<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>勤怠管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0f1117;font-family:'Helvetica Neue',Arial,'Hiragino Sans','Yu Gothic',sans-serif;color:#e8eaf0;min-height:100vh;}
input,button,select{font-family:inherit;font-size:14px;}
button{cursor:pointer;border:none;border-radius:10px;font-weight:700;touch-action:manipulation;}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 80px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.header h1{font-size:18px;font-weight:800;}
.icon-btn{background:none;color:#9ca3af;font-size:18px;padding:6px 8px;text-decoration:none;}
.card{background:#1a1d2a;border:1px solid #2e3250;border-radius:14px;padding:14px;margin-bottom:12px;}
.note{color:#9ca3af;font-size:12px;line-height:1.8;}
.err{color:#e05252;font-size:13px;margin-top:8px;line-height:1.7;}
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
.month-nav button{background:#22263a;color:#e8eaf0;width:36px;height:36px;border-radius:50%;font-size:16px;}
.month-nav button:disabled{opacity:.3;}
.month-nav .label{font-size:16px;font-weight:800;min-width:110px;text-align:center;}
select.staff{width:100%;padding:10px;border-radius:10px;border:1px solid #2e3250;background:#1a1d2a;color:#e8eaf0;margin-bottom:10px;}
.sum{display:flex;gap:8px;margin-bottom:10px;}
.sum .box{flex:1;background:#1a1d2a;border:1px solid #2e3250;border-radius:12px;padding:10px 6px;text-align:center;}
.sum .box .v{font-size:16px;font-weight:800;}
.sum .box .k{font-size:10.5px;color:#9ca3af;margin-top:2px;}
.sum .box.warn .v{color:#f08080;}
.row{display:flex;align-items:center;gap:8px;padding:11px 4px;border-top:1px solid #2e3250;cursor:pointer;}
.row:first-child{border-top:none;}
.row:active{background:#22263a;}
.row .d{width:64px;color:#9ca3af;font-size:13px;flex-shrink:0;}
.row .t{flex:1;font-variant-numeric:tabular-nums;font-size:14.5px;line-height:1.6;}
.row .h{color:#9ca3af;font-size:12px;white-space:nowrap;}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#2e3250;color:#9ca3af;margin-left:4px;vertical-align:middle;}
.tag.warn{background:#5a2323;color:#ffb3b3;}
.tag.work{background:#1e3d2c;color:#7fd8a6;}
.fixbtn{background:#5a2323;color:#ffd0d0;font-size:12px;padding:6px 10px;border-radius:8px;margin-left:6px;}
.add-btn{width:100%;padding:13px;background:#5b8ef5;color:#fff;font-size:14.5px;margin-bottom:12px;}
.sec-title{font-size:13px;font-weight:800;margin:6px 2px 8px;color:#c9cde0;}
.set-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #2e3250;}
.set-row:first-of-type{border-top:none;}
.set-row .nm{flex:1;font-size:13.5px;line-height:1.5;}
.set-row .nm small{display:block;color:#9ca3af;font-size:11px;}
.set-row label{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:#9ca3af;gap:3px;width:62px;}
.set-row input{width:20px;height:20px;}
details{margin-bottom:12px;}
summary{cursor:pointer;color:#9ca3af;font-size:12.5px;padding:6px 2px;}
.hist{font-size:12px;color:#9ca3af;line-height:1.8;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#1a1d2a;border:1px solid #2e3250;border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 16px 24px;max-height:92vh;overflow:auto;}
.sheet h2{font-size:16px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.field label{display:block;color:#9ca3af;font-size:11px;margin-bottom:4px;}
.field input{width:100%;padding:11px;border-radius:8px;border:1px solid #2e3250;background:#0f1117;color:#e8eaf0;}
.two{display:flex;gap:10px;}
.two .field{flex:1;}
.btns{display:flex;gap:8px;margin-top:6px;}
.btns button{flex:1;padding:13px;font-size:14.5px;}
.btn-save{background:#5b8ef5;color:#fff;}
.btn-del{background:#3a1c1c;color:#f08080;flex:0 0 auto!important;padding:13px 16px!important;}
.btn-cancel{background:#22263a;color:#9ca3af;}
.btn-clear{background:#22263a;color:#9ca3af;font-size:11px;padding:4px 8px;border-radius:6px;margin-top:4px;}
.spinner{width:28px;height:28px;border:3px solid #2e3250;border-top-color:#5b8ef5;border-radius:50%;margin:60px auto;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>勤怠管理</h1>
    <div>
      <button class="icon-btn" onclick="reloadAll()" title="更新">🔄</button>
      <a class="icon-btn" href="./home.html" title="ホームへ">🏠</a>
    </div>
  </div>
  <div id="app"><div class="spinner"></div></div>
</div>

<script>
const SUPABASE_URL = "https://hxrycxlcsetpjfbwqybv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dACRpnqVTz6aSsD2Nrz8Ag_7JmeA3s6";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STALE_OPEN_HOURS = 18; // DB側(punch関数)と同じ

let ME = null;         // 自分のstaff行(owner / manager のみ使える)
let staffAll = [];     // 有効な従業員すべて
let targetId = null;   // 表示中の従業員
let month = null;      // {y, m}
let rows = [];         // 表示中の月・従業員の勤務記録
let deletedRows = [];  // 削除された記録(店主のみ)
let loadSeq = 0;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const ROLE_LABEL = { owner: '店主', manager: '店長', staff: '一般スタッフ', accounting: '経理' };

// ---- 時刻(日本時間。営業日は7:00〜翌6:59。深夜は 25:00 のように表示)----
const JST = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function jstParts(ts) {
  const p = {};
  JST.formatToParts(new Date(ts)).forEach(x => { p[x.type] = x.value; });
  return { date: `${p.year}-${p.month}-${p.day}`, h: +p.hour, m: +p.minute };
}
function dayDiff(a, b) {
  const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(ay, am - 1, ad) - Date.UTC(by, bm - 1, bd)) / 86400000);
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function bizTime(ts, bizDate) { const p = jstParts(ts); return `${p.h + 24 * dayDiff(p.date, bizDate)}:${pad2(p.m)}`; }
function inputTime(ts) { const p = jstParts(ts); return `${pad2(p.h)}:${pad2(p.m)}`; } // <input type=time> 用(0:00〜23:59)
function dateLabel(d) { const [y, m, dd] = d.split('-').map(Number); return `${m}/${dd}(${'日月火水木金土'[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]})`; }
function durText(ms) { const min = Math.max(0, Math.round(ms / 60000)); return `${Math.floor(min / 60)}時間${pad2(min % 60)}分`; }
function bizToday() { return jstParts(Date.now() - 7 * 3600 * 1000).date; }
// 営業日 + HH:MM → 日時。0:00〜6:59 は翌日(営業日の区切りが7:00のため)
function toISO(bizDate, hhmm) {
  const [h, mi] = hhmm.split(':').map(Number);
  return `${h < 7 ? addDays(bizDate, 1) : bizDate}T${pad2(h)}:${pad2(mi)}:00+09:00`;
}

// ---- 起動 ----
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showMsg('ログインが必要です。<br>ホーム画面でログインしてから開いてください。'); return; }
  try {
    const { data, error } = await sb.from('staff').select('id,name,role,active').eq('auth_user_id', session.user.id).maybeSingle();
    if (error) throw error;
    ME = data;
  } catch (e) { showMsg('読み込みに失敗しました: ' + esc(e.message || String(e))); return; }
  if (!ME || !ME.active || !['owner', 'manager'].includes(ME.role)) { showMsg('この画面は、店主・店長のみ使えます。'); return; }
  const t = bizToday();
  month = { y: +t.slice(0, 4), m: +t.slice(5, 7) };
  await reloadAll();
}
function showMsg(html) { document.getElementById('app').innerHTML = `<div class="card"><div class="note">${html}</div></div>`; }

async function loadStaff() {
  const { data, error } = await sb.from('staff').select('id,name,role,active,attendance_enabled,punch_display,auth_user_id').eq('active', true).order('id');
  if (error) throw error;
  staffAll = data || [];
}
function targets() { return staffAll.filter(s => s.attendance_enabled); }
function monthRange() {
  const last = new Date(Date.UTC(month.y, month.m, 0)).getUTCDate();
  return [`${month.y}-${pad2(month.m)}-01`, `${month.y}-${pad2(month.m)}-${pad2(last)}`];
}

async function reloadAll() {
  if (!ME) return;
  const seq = ++loadSeq;
  try {
    await loadStaff();
    const list = targets();
    if (!list.find(s => s.id === targetId)) targetId = list.length ? list[0].id : null;
    rows = []; deletedRows = [];
    if (targetId) {
      const [first, last] = monthRange();
      const q1 = sb.from('attendance').select('*').eq('staff_id', targetId).gte('business_date', first).lte('business_date', last).order('clock_in', { ascending: true });
      const q2 = ME.role === 'owner'
        ? sb.from('attendance_history').select('*').eq('action', 'delete').gte('old_row->>business_date', first).lte('old_row->>business_date', last).order('changed_at', { ascending: false })
        : Promise.resolve({ data: [], error: null });
      const [r1, r2] = await Promise.all([q1, q2]);
      if (r1.error) throw r1.error;
      if (seq !== loadSeq) return;
      rows = r1.data || [];
      deletedRows = ((r2.data) || []).filter(h => h.old_row && h.old_row.staff_id === targetId);
    }
    if (seq !== loadSeq) return;
    render();
  } catch (e) {
    if (seq !== loadSeq) return;
    showMsg('読み込みに失敗しました: ' + esc(e.message || String(e)));
  }
}

function isWorking(r) { return !r.clock_out && new Date(r.clock_in).getTime() > Date.now() - STALE_OPEN_HOURS * 3600 * 1000; }
function staffName(id) { const s = staffAll.find(x => x.id === id); return s ? s.name : '(不明)'; }

function render() {
  const list = targets();
  const t = bizToday();
  const isCurrent = month.y === +t.slice(0, 4) && month.m === +t.slice(5, 7);
  let html = `<div class="month-nav">
    <button onclick="shiftMonth(-1)">‹</button>
    <div class="label">${month.y}年${month.m}月</div>
    <button onclick="shiftMonth(1)" ${isCurrent ? 'disabled' : ''}>›</button>
  </div>`;

  if (list.length === 0) {
    html += `<div class="card"><div class="note">打刻の対象者がまだ設定されていません。${ME.role === 'owner' ? '下の「設定」で、対象にする人を選んでください。' : '店主に設定を依頼してください。'}</div></div>`;
  } else {
    html += `<select class="staff" onchange="selectStaff(Number(this.value))">${list.map(s => `<option value="${s.id}" ${s.id === targetId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`;

    const closed = rows.filter(r => r.clock_out);
    const totalMs = closed.reduce((n, r) => n + (new Date(r.clock_out) - new Date(r.clock_in)), 0);
    const days = new Set(rows.map(r => r.business_date)).size;
    const missing = rows.filter(r => !r.clock_out && !isWorking(r)).length;
    html += `<div class="sum">
      <div class="box"><div class="v">${esc(durText(totalMs))}</div><div class="k">勤務時間の合計</div></div>
      <div class="box"><div class="v">${days}日</div><div class="k">出勤日数</div></div>
      <div class="box ${missing ? 'warn' : ''}"><div class="v">${missing}件</div><div class="k">退勤の記録なし</div></div>
    </div>`;

    html += `<button class="add-btn" onclick="openEditor(null)">＋ 勤務を追加(押し忘れ・手入力)</button>`;

    html += `<div class="card">`;
    if (rows.length === 0) html += `<div class="note">この月の記録はありません</div>`;
    html += rows.map(r => {
      const open = !r.clock_out;
      const working = isWorking(r);
      return `<div class="row" onclick="openEditor(${r.id})">
        <div class="d">${esc(dateLabel(r.business_date))}</div>
        <div class="t">${esc(bizTime(r.clock_in, r.business_date))} 〜 ${open
          ? (working ? '<span class="tag work">勤務中</span>' : '<span class="tag warn">退勤の記録なし</span>')
          : esc(bizTime(r.clock_out, r.business_date))}
          ${r.source === 'manual' ? '<span class="tag">手入力</span>' : ''}${r.edited ? '<span class="tag">修正済み</span>' : ''}
          ${open && !working ? `<button class="fixbtn" onclick="event.stopPropagation();openEditor(${r.id},'out')">退勤を入力</button>` : ''}</div>
        <div class="h">${open ? '' : esc(durText(new Date(r.clock_out) - new Date(r.clock_in)))}</div>
      </div>`;
    }).join('');
    html += `</div>`;

    if (ME.role === 'owner' && deletedRows.length) {
      html += `<details><summary>削除された記録(${deletedRows.length}件)</summary><div class="card hist">${deletedRows.map(h => {
        const o = h.old_row;
        return `${esc(dateLabel(o.business_date))} ${esc(bizTime(o.clock_in, o.business_date))} 〜 ${o.clock_out ? esc(bizTime(o.clock_out, o.business_date)) : '(退勤なし)'}
          <span class="tag">${esc(new Date(h.changed_at).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }))} に削除</span>`;
      }).join('<br>')}</div></details>`;
    }
  }

  if (ME.role === 'owner') html += renderSettings();
  document.getElementById('app').innerHTML = html;
}

function renderSettings() {
  return `<div class="sec-title" style="margin-top:18px;">設定(店主のみ)</div>
  <div class="card">
    <div class="note" style="margin-bottom:6px;">
      <b>打刻の対象</b>:出退勤を打刻する人。QR打刻にはログイン用アカウントが必要です(ログインがなくても、この画面からの手入力はできます)。<br>
      <b>QR表示端末</b>:レジのiPadなど、QRを表示するアカウント。店主は設定なしで表示できます。打刻の対象の人は、QRを表示できません(自宅で自分のQRを出して打刻する不正を防ぐため)。
    </div>
    ${staffAll.filter(s => s.role !== 'accounting').map(s => `<div class="set-row">
      <div class="nm">${esc(s.name)}<small>${esc(ROLE_LABEL[s.role] || '役割なし')} ・ ${s.auth_user_id ? 'ログインあり' : '<span style="color:#f0b27a">ログイン未作成</span>'}</small></div>
      <label><input type="checkbox" ${s.attendance_enabled ? 'checked' : ''} onchange="setFlag(${s.id},'attendance_enabled',this.checked)">打刻の対象</label>
      <label><input type="checkbox" ${s.punch_display ? 'checked' : ''} ${s.attendance_enabled ? 'disabled' : ''} onchange="setFlag(${s.id},'punch_display',this.checked)">QR表示端末</label>
    </div>`).join('')}
    <div id="setMsg"></div>
  </div>`;
}

async function setFlag(id, key, on) {
  const patch = { [key]: on };
  if (on) patch[key === 'attendance_enabled' ? 'punch_display' : 'attendance_enabled'] = false; // どちらか一方だけ
  const { error } = await sb.from('staff').update(patch).eq('id', id);
  if (error) {
    await loadStaff().catch(() => {}); render();
    document.getElementById('setMsg').innerHTML = `<div class="err">保存に失敗しました: ${esc(error.message)}</div>`;
    return;
  }
  await reloadAll();
}

function shiftMonth(d) {
  let { y, m } = month; m += d;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  const t = bizToday();
  if (y * 12 + m > (+t.slice(0, 4)) * 12 + (+t.slice(5, 7))) return;
  month = { y, m };
  reloadAll();
}
function selectStaff(id) { targetId = id; reloadAll(); }

// ---- 訂正(追加・修正・削除)----
let editing = null; // 編集中の行(追加なら null)
async function openEditor(id, focus) {
  editing = id ? rows.find(r => r.id === id) : null;
  if (id && !editing) return;
  const t = bizToday();
  const isCurrent = month.y === +t.slice(0, 4) && month.m === +t.slice(5, 7);
  const date = editing ? editing.business_date : (isCurrent ? t : `${month.y}-${pad2(month.m)}-01`);
  const inV = editing ? inputTime(editing.clock_in) : '';
  const outV = editing && editing.clock_out ? inputTime(editing.clock_out) : '';
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'editor';
  ov.innerHTML = `<div class="sheet">
    <h2>${editing ? '勤務の訂正' : '勤務を追加'} <span class="note">(${esc(staffName(targetId))})</span></h2>
    <div class="field"><label>日付(営業日)</label><input type="date" id="ed-date" value="${date}"></div>
    <div class="two">
      <div class="field"><label>出勤</label><input type="time" id="ed-in" value="${inV}"></div>
      <div class="field"><label>退勤</label><input type="time" id="ed-out" value="${outV}">
        <button class="btn-clear" type="button" onclick="document.getElementById('ed-out').value=''">退勤なしにする</button></div>
    </div>
    <div class="note" style="margin-bottom:10px;">深夜(0:00〜6:59)は、翌日の時刻として扱われます(例:退勤 01:00 → 一覧では 25:00 と表示)。</div>
    <div class="field"><label>メモ(任意)</label><input type="text" id="ed-note" value="${editing && editing.note ? esc(editing.note) : ''}" placeholder="例:押し忘れのため手入力"></div>
    <div id="ed-msg"></div>
    <div class="btns">
      ${editing ? '<button class="btn-del" onclick="deleteRow()">削除</button>' : ''}
      <button class="btn-cancel" onclick="closeEditor()">キャンセル</button>
      <button class="btn-save" id="ed-save" onclick="saveRow()">保存</button>
    </div>
    <div id="ed-hist"></div>
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeEditor(); });
  document.body.appendChild(ov);
  if (focus === 'out') document.getElementById('ed-out').focus();
  if (editing && ME.role === 'owner') loadRowHistory(editing.id);
}
function closeEditor() { const e = document.getElementById('editor'); if (e) e.remove(); editing = null; }

async function loadRowHistory(id) {
  const { data } = await sb.from('attendance_history').select('*').eq('attendance_id', id).order('changed_at', { ascending: false });
  const el = document.getElementById('ed-hist');
  if (!el || !data || !data.length) return;
  el.innerHTML = `<details open style="margin-top:14px;"><summary>変更履歴(${data.length}件)</summary><div class="hist">${data.map(h => {
    const o = h.old_row;
    return `変更前: ${esc(bizTime(o.clock_in, o.business_date))} 〜 ${o.clock_out ? esc(bizTime(o.clock_out, o.business_date)) : '(退勤なし)'}
      <span class="tag">${esc(new Date(h.changed_at).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }))}</span>`;
  }).join('<br>')}</div></details>`;
}

function edMsg(t) { document.getElementById('ed-msg').innerHTML = t ? `<div class="err">${esc(t)}</div>` : ''; }

async function saveRow() {
  const date = document.getElementById('ed-date').value;
  const inV = document.getElementById('ed-in').value;
  const outV = document.getElementById('ed-out').value;
  const note = document.getElementById('ed-note').value.trim() || null;
  if (!date) return edMsg('日付を入れてください');
  if (!inV) return edMsg('出勤の時刻を入れてください');
  const clock_in = toISO(date, inV);
  const clock_out = outV ? toISO(date, outV) : null;
  if (clock_out && new Date(clock_out) <= new Date(clock_in)) return edMsg('退勤が出勤より前(または同じ)になっています。時刻を確認してください');
  const btn = document.getElementById('ed-save');
  btn.disabled = true;
  edMsg('');
  const { error } = editing
    ? await sb.from('attendance').update({ clock_in, clock_out, note }).eq('id', editing.id)
    : await sb.from('attendance').insert({ staff_id: targetId, clock_in, clock_out, note });
  if (error) { btn.disabled = false; return edMsg('保存に失敗しました: ' + (error.message || '')); }
  closeEditor();
  // 日付を別の月に変えた場合は、その月へ移動して表示する
  const ym = jstParts(new Date(clock_in).getTime() - 7 * 3600 * 1000).date;
  month = { y: +ym.slice(0, 4), m: +ym.slice(5, 7) };
  await reloadAll();
}

async function deleteRow() {
  if (!editing) return;
  if (!window.confirm('この勤務記録を削除しますか?\n(削除しても、店主の画面の「削除された記録」に残ります)')) return;
  const { error } = await sb.from('attendance').delete().eq('id', editing.id);
  if (error) return edMsg('削除に失敗しました: ' + (error.message || ''));
  closeEditor();
  await reloadAll();
}

init();
</script>
