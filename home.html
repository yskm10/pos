<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>業務アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0f1117;font-family:'Helvetica Neue',Arial,sans-serif;color:#e8eaf0;min-height:100vh;}
input,button{font-family:inherit;font-size:14px;}
button{cursor:pointer;border:none;border-radius:8px;font-weight:700;}
.wrap{max-width:480px;margin:0 auto;padding:24px 18px 60px;min-height:100vh;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.header h1{font-size:18px;font-weight:800;letter-spacing:.02em;}
.header .sub{color:#9ca3af;font-size:11px;margin-top:2px;}
.icon-btn{background:none;border:none;color:#9ca3af;font-size:18px;padding:6px 8px;}
.card{background:#1a1d2a;border:1px solid #2e3250;border-radius:14px;padding:20px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;color:#9ca3af;font-size:11px;margin-bottom:4px;}
.field input{width:100%;padding:10px;border-radius:8px;border:1px solid #2e3250;background:#0f1117;color:#e8eaf0;}
.btn-main{width:100%;padding:12px;background:#5b8ef5;color:#fff;font-size:14px;margin-top:6px;}
.btn-main:disabled{opacity:.5;}
.btn-link{background:none;color:#5b8ef5;font-size:12.5px;width:100%;padding:10px;margin-top:4px;}
.err{color:#e05252;font-size:12px;margin-top:8px;line-height:1.6;}
.ok{color:#4caf80;font-size:12px;margin-top:8px;line-height:1.6;}
.tile{display:flex;align-items:center;gap:14px;background:#1a1d2a;border:1px solid #2e3250;border-radius:14px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:#e8eaf0;}
.tile:active{background:#22263a;}
.tile .emoji{font-size:26px;width:36px;text-align:center;}
.tile .t{font-weight:700;font-size:15px;}
.tile .d{color:#9ca3af;font-size:11.5px;margin-top:2px;}
.role-badge{display:inline-block;background:#2e3250;color:#9ca3af;font-size:11px;padding:4px 10px;border-radius:20px;margin-bottom:16px;}
.empty{text-align:center;color:#9ca3af;font-size:13px;padding:40px 10px;line-height:1.9;}
.spinner{width:28px;height:28px;border:3px solid #2e3250;border-top-color:#5b8ef5;border-radius:50%;margin:60px auto;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>業務アプリ</h1>
    </div>
    <div>
      <button class="icon-btn" onclick="location.reload()" title="更新">🔄</button>
      <button class="icon-btn" id="logoutBtn" style="display:none;" onclick="doLogout()" title="ログアウト">🚪</button>
    </div>
  </div>

  <div id="app"><div class="spinner"></div></div>
</div>

<script>
const SUPABASE_URL = "https://hxrycxlcsetpjfbwqybv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dACRpnqVTz6aSsD2Nrz8Ag_7JmeA3s6";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// このホーム画面から行き来できるアプリ一覧(役割ごとに出し分け)
const APPS = [
  {key:'pos', label:'レジ', desc:'注文・会計・レジ金・売上管理', emoji:'🧾', url:'./pos.html', roles:['owner','manager','staff']},
  {key:'pos-local', label:'レジ用POS', desc:'店内専用・印刷/ドロワー対応(お店のWi-Fi内のみ接続可)', emoji:'🖨', url:'http://192.168.10.200:8080/pos.html', roles:['owner','manager','staff']},
  {key:'checklist', label:'開店・閉店チェック', desc:'毎日のチェックリスト', emoji:'✅', url:'./checklist.html', roles:['owner','manager','staff']},
  {key:'expense', label:'経費帳', desc:'レシート・小口現金の管理', emoji:'💴', url:'./expense-app.html', roles:['owner','manager','accounting']},
];

let escapeHtml = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function init(){
  const { data:{session} } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  await afterLogin();
}
sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT') renderLogin(); });

async function afterLogin(){
  document.getElementById('logoutBtn').style.display='inline-block';
  // 初回ログイン時、staffテーブルの自分の行(メール一致)に自分のアカウントを紐付ける
  try{ await sb.rpc('link_my_staff_account'); }catch(e){ console.error(e); }
  await renderMenu();
}

function renderLogin(showSignup){
  document.getElementById('logoutBtn').style.display='none';
  const app = document.getElementById('app');
  if(!showSignup){
    app.innerHTML = `
      <div class="card">
        <div class="field"><label>メールアドレス</label><input type="email" id="li-email" autocomplete="username"></div>
        <div class="field"><label>パスワード</label><input type="password" id="li-password" autocomplete="current-password"></div>
        <div id="li-msg"></div>
        <button class="btn-main" id="li-btn">ログイン</button>
        <button class="btn-link" onclick="renderLogin(true)">はじめての方はこちら(アカウント作成)</button>
      </div>`;
    document.getElementById('li-btn').onclick = doLogin;
    document.getElementById('li-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  }else{
    app.innerHTML = `
      <div class="card">
        <div style="font-size:12px;color:#9ca3af;margin-bottom:14px;line-height:1.7;">アカウント作成後、店主が役割を設定するまでは画面が使えるようになりません。作成できたら店主に伝えてください。</div>
        <div class="field"><label>メールアドレス</label><input type="email" id="su-email" autocomplete="username"></div>
        <div class="field"><label>パスワード(6文字以上)</label><input type="password" id="su-password" autocomplete="new-password"></div>
        <div id="su-msg"></div>
        <button class="btn-main" id="su-btn">アカウントを作成</button>
        <button class="btn-link" onclick="renderLogin(false)">ログイン画面に戻る</button>
      </div>`;
    document.getElementById('su-btn').onclick = doSignup;
  }
}

async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const msg = document.getElementById('li-msg');
  msg.innerHTML='';
  if(!email||!password){ msg.innerHTML='<div class="err">メールアドレスとパスワードを入力してください</div>'; return; }
  const btn = document.getElementById('li-btn');
  btn.disabled=true; btn.textContent='ログイン中...';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await afterLogin();
  }catch(e){
    msg.innerHTML = `<div class="err">ログインに失敗しました: ${escapeHtml(e.message||String(e))}</div>`;
    btn.disabled=false; btn.textContent='ログイン';
  }
}

async function doSignup(){
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const msg = document.getElementById('su-msg');
  msg.innerHTML='';
  if(!email||!password){ msg.innerHTML='<div class="err">メールアドレスとパスワードを入力してください</div>'; return; }
  if(password.length<6){ msg.innerHTML='<div class="err">パスワードは6文字以上にしてください</div>'; return; }
  const btn = document.getElementById('su-btn');
  btn.disabled=true; btn.textContent='作成中...';
  try{
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error) throw error;
    if(data.session){
      // メール確認が不要な設定の場合はそのままログイン状態になる
      await afterLogin();
    }else{
      msg.innerHTML = '<div class="ok">アカウントを作成しました。確認メールが届いていればそちらのリンクを開いてください。届いていなければそのままログインを試してみてください。</div>';
      btn.disabled=false; btn.textContent='アカウントを作成';
    }
  }catch(e){
    msg.innerHTML = `<div class="err">作成に失敗しました: ${escapeHtml(e.message||String(e))}</div>`;
    btn.disabled=false; btn.textContent='アカウントを作成';
  }
}

async function doLogout(){ await sb.auth.signOut(); renderLogin(); }

async function renderMenu(){
  const app = document.getElementById('app');
  const { data:{session} } = await sb.auth.getSession();
  let role = null;
  let displayName = session.user.email;
  try{
    const { data, error } = await sb.from('staff').select('role,name').eq('auth_user_id', session.user.id).maybeSingle();
    if(error) throw error;
    role = data ? data.role : null;
    if(data && data.name) displayName = data.name;
  }catch(e){
    console.error(e);
  }

  if(!role){
    app.innerHTML = `<div class="empty">まだ利用できる機能がありません。<br>店主に従業員マスタでの権限設定を依頼してください。<br><br>(ログイン中: ${escapeHtml(session.user.email)})</div>`;
    return;
  }

  const ROLE_LABELS = {owner:'店主', manager:'店長', staff:'一般スタッフ', accounting:'経理'};
  const apps = APPS.filter(a=>a.roles.includes(role));
  const tiles = apps.map(a=>`
    <a class="tile" href="${a.url}">
      <div class="emoji">${a.emoji}</div>
      <div>
        <div class="t">${a.label}</div>
        <div class="d">${a.desc}</div>
      </div>
    </a>`).join('');

  app.innerHTML = `
    <div class="role-badge">${ROLE_LABELS[role]||role} · ${escapeHtml(displayName)}</div>
    ${tiles || '<div class="empty">この役割で使える画面がありません</div>'}
  `;
}

init();
</script>
</body>
</html>
